deploy_website:
  stage: deploy
  script:
    - echo "Do your deploy here"
    - apt-get update -y
    - apt-get install -y rsync
    - echo "Deploying to production server..."
    - aws s3 cp ./public/ s3://$S3_BUCKET/ --recursive
  environment: production
  

post-deploy-test:
  stage: post-deploy-test
  script:
    - echo "Running post-deployment tests..."
    # Aquí puedes agregar comandos para ejecutar tus pruebas en producción
    - curl -f http://production_server_url/health || exit 1
    - dotnet test --configuration Release --filter "Category=PostDeploy"
  environment:
    name: production
  only:
    - main
  when: manual
